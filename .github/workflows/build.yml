name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: false

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Download gradle-wrapper.jar if missing
      run: |
        JAR=gradle/wrapper/gradle-wrapper.jar
        if [ ! -s "$JAR" ]; then
          echo "Downloading gradle-wrapper.jar..."
          curl -sL "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
               -o "$JAR" || \
          curl -sL "https://services.gradle.org/distributions/gradle-8.4-wrapper.jar" \
               -o "$JAR"
          ls -la "$JAR"
        else
          echo "gradle-wrapper.jar exists: $(ls -la $JAR)"
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FirefoxPC-debug-${{ github.run_number }}
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
