name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        lfs: false

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Fix gradlew
      run: |
        chmod +x gradlew
        mkdir -p gradle/wrapper
        if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
          curl -sL https://raw.githubusercontent.com/google/iosched/main/gradle/wrapper/gradle-wrapper.jar \
               -o gradle/wrapper/gradle-wrapper.jar
          echo "gradle-wrapper.jar downloaded"
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FirefoxPC-debug-${{ github.run_number }}
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
