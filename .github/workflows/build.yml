name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        lfs: false

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Check assets
      run: |
        echo "=== Scripts ==="
        ls -lh app/src/main/assets/scripts/ 2>/dev/null || echo "No scripts"
        echo "=== System parts ==="
        ls -lh app/src/main/assets/system/ 2>/dev/null || echo "No system parts"
        echo "=== Icons ==="
        find app/src/main/res -name "ic_launcher*" 2>/dev/null | head -10

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FirefoxPC-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        compression-level: 0

    - name: Create Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: "build-${{ github.run_number }}"
        name: "Firefox PC — Build ${{ github.run_number }}"
        body: |
          تحميل APK من الأسفل.
          أول تشغيل يستغرق 3-4 دقائق.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
